  <main id="main" class="faq-page">
    <section>
      <div class="wrap">
        <div class="section-head">
          <h1 class="split">{{faq.h2}}</h1>
        </div>
        <div class="faq-list">
          {{@faq_items}}
        </div>
        <div class="faq-more reveal">
          <h2>{{faq.cta_h}}</h2>
          <p>{{faq.cta_p}}</p>
          <a class="btn btn-primary" href="{{@home}}#zapis">{{form.button}}</a>
        </div>
      </div>
    </section>
  </main>

{{>footer}}

  <script src="/main.js" defer></script>
